openapi: "3.1.0"
info:
  title: Customers API
  version: "1.0.0"
paths:
  /customers:
    get:
      operationId: listCustomers
      summary: List all active customers
      responses:
        "200":
          description: A list of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
